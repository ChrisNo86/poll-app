<a class="survey-card" [class.survey-card--featured]="variant() === 'featured'" [routerLink]="['/survey', survey().id]">
  <article class="survey-card__content">
    <p class="survey-card__category">{{ survey().category }}</p>
    <h4 class="survey-card__title">{{ survey().title }}</h4>
    <p class="survey-card__deadline">
      <time>{{ deadline() }}</time>
    </p>
  </article>
</a>
